name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked --offline
      - run: python3 tools/bundle.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            F=$(basename dist/*.hnmod .hnmod)
            TAG="v${F#*-}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.hnmod dist/*.hnmod.sha256 dist/*.compatibility.json --clobber
          else
            gh release create "$TAG" dist/*.hnmod dist/*.hnmod.sha256 dist/*.compatibility.json \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
