helper = "adapters/key_capture.rs"
bindings = [{ name = "game", ty = "&crate::game::Game<'_>", value = "&*self" }]

[[injection]]
id = "mouse-bind"
target = "horizon_client::game::Game<'_>::play_mouse"
kind = "HEAD"
cancellable = true
helper = "adapters/mouse_bind.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "winit::event::MouseButton", value = "button" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "client-frame"
target = "horizon_client::game::Game<'_>::hud"
kind = "HEAD"
helper = "adapters/frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]


[[state]]
id = "client"
target = "horizon_client::game::Game"
ty = "crate::game::vape_rs::core::Client"
initial = "::core::default::Default::default()"

[[state.constructor]]
target = "horizon_client::game::Game<'_>::new"
selector = "Game"
