[mod]
id = "vape-rs"
version = "0.1.0-dev"
priority = 100

[compatibility]
horizon_revision = "e1b2b0b2fdf5962a30fb5de31b0c1bd6829d9083"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "vape_rs"
source = "runtime.rs"

[[injection]]
id = "client-tick"
target = "horizon_client::game::Game<'_>::tick"
kind = "HEAD"
helper = "adapters/tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "client-input"
target = "horizon_client::game::debug_keys::Game<'_>::debug_key"
kind = "HEAD"
helper = "adapters/input.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "winit::keyboard::KeyCode", value = "key" },
  { name = "action", ty = "horizon_client::debug_keys::KeyAction", value = "action" },
]

[[injection]]
id = "client-hud"
target = "horizon_client::game::extras::Game<'_>::draw_extras"
kind = "HEAD"
helper = "adapters/hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# The host's control-key parser omits the integration keys. Extend only these
# names so real keyboard events and controlled scenarios reach the same hook.
[[injection]]
id = "control-key-names"
target = "horizon_client::game::control::key_code"
kind = "HEAD"
cancellable = true
helper = "adapters/control_keys.rs"
bindings = [{ name = "name", ty = "&str", value = "name" }]

[[injection]]
id = "gui-events"
target = "horizon_client::game::<Game<'_> as ApplicationHandler>::window_event"
kind = "HEAD"
helper = "adapters/gui_events.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "id", ty = "winit::window::WindowId", value = "id" },
  { name = "event", ty = "&winit::event::WindowEvent", value = "&event" },
]

[[injection]]
id = "gui-render"
target = "horizon_client::game::debug_keys::Game<'_>::draw_debug_overlay"
kind = "HEAD"
helper = "adapters/gui_render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "game-key-capture"
target = "horizon_client::game::Game<'_>::mapped_key"
kind = "HEAD"
cancellable = true
helper = "adapters/key_capture.rs"
bindings = [{ name = "game", ty = "&crate::game::Game<'_>", value = "&*self" }]

[[injection]]
id = "control-key-capture"
